# Build the Docker image on every push/PR (catches Dockerfile/build breakage),
# and publish it to GHCR on version tags (v0.2.0 → ghcr.io/codemarchant/rexclaw).
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rexclaw
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rexclaw-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A image that builds but crash-loops (wrong paths, missing assets) is
      # exactly what a build-only check can't catch — boot it and probe the
      # SPA, the API and a bundled asset before anything gets published.
      - name: Smoke test — container boots and serves
        run: |
          docker run -d --name rexclaw-ci -p 8990:8990 rexclaw-ci
          for i in $(seq 1 30); do
            if curl -fs -X POST http://localhost:8990/api/config/get \
                 -H 'Content-Type: application/json' -d '{}' >/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          if [ "${ok:-}" != 1 ]; then
            echo "::error::container never became healthy"; docker logs rexclaw-ci; exit 1
          fi
          curl -fs http://localhost:8990/ >/dev/null
          curl -fs http://localhost:8990/assets/vrma/walking.vrma -o /dev/null
          curl -fs http://localhost:8990/manifest.webmanifest >/dev/null
          docker rm -f rexclaw-ci

      - name: Push (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
