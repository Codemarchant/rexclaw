[project]
name = "rexclaw"
version = "0.77.0"
description = "Rexclaw Companions — standalone voice/text AI companion app (Grok-powered, BYOK, self-hosted)"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "pillow>=10",
    "numpy>=1.26",
    "lameenc>=1.7",
    "soundfile>=0.12",
    "soxr>=0.3",
    "pyworld-prebuilt>=0.3.6",
    # Voice pipeline (server/pipeline/): streamed HTTP to the engines,
    # WebSockets to xAI's streaming STT/TTS, Silero VAD + Smart Turn.
    "httpx>=0.27",
    "websockets>=14",
    "onnxruntime>=1.17",
    # Claude brains (server/pipeline/llm.py AnthropicLlm).
    "anthropic>=1.11",
]

[project.scripts]
rexclaw = "server.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "server.routes", "server.pipeline"]
