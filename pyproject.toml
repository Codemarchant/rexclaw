[project]
name = "rexclaw"
version = "0.89.1"
description = "Rexclaw Companions — standalone voice/text AI companion app (Grok-powered, BYOK, self-hosted)"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "pillow>=10.1",
    "numpy>=1.26",
    "lameenc>=1.7",
    "soundfile>=0.12",
    "soxr>=0.3",
    "pyworld-prebuilt>=0.3.6",
    # Voice pipeline (server/pipeline/): streamed HTTP to the engines,
    # WebSockets to xAI's streaming STT/TTS, Silero VAD + Smart Turn.
    "httpx>=0.27",
    "websockets>=14",
    "onnxruntime>=1.17",
    # Meaning-based memory search (server/memory_vectors.py).
    "tokenizers>=0.20",
    # Claude brains (server/pipeline/llm.py AnthropicLlm).
    "anthropic>=1.11",
    # Audio from links (server/media_fetch.py): yt-dlp with its YouTube
    # solver scripts ([default] → yt-dlp-ejs), Deno as the JS runtime those
    # need, and PyAV to decode what it downloads (webm/opus, m4a).
    "yt-dlp[default]>=2026.8.19",
    "deno>=2.5",
    "av>=14",
]

[project.scripts]
rexclaw = "server.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "server.routes", "server.pipeline"]
