[project]
name = "rexclaw"
version = "0.3.0"
description = "Rexclaw Companions — standalone voice/text AI companion app (Grok-powered, BYOK, self-hosted)"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "python-multipart>=0.0.9",
]

[project.scripts]
rexclaw = "server.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "server.routes"]
