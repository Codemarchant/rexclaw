<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe · Rexclaw</title>
<link rel="stylesheet" href="../lib/games.css">
<!-- Tic-Tac-Toe against a companion over the Neuro API (../lib/neuro.js),
     in three modes: classic, Mutiny (three in a row LOSES) and a best-of-five
     match. Empty squares show their number, so the companion picks a number
     it can see, and each board comes with its wins and must-blocks spelled
     out (in Mutiny: the squares that would sink them). -->
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 360px; margin: 0 auto; position: relative; }
  .sq {
    aspect-ratio: 1; border-radius: 16px; background: linear-gradient(180deg, #1c2a44, #142036); border: 1px solid var(--line);
    display: grid; place-items: center; cursor: pointer; transition: background .15s, transform .1s; user-select: none;
  }
  .sq.free:hover { background: #22324f; transform: translateY(-2px); }
  .sq .n { font-size: 0.9rem; color: #475569; font-weight: 600; }
  .sq svg { width: 70%; height: 70%; animation: pop .3s cubic-bezier(.2,1.6,.4,1); }
  .sq.win { background: linear-gradient(180deg, #4338ca, #312e81); box-shadow: 0 0 20px rgba(129,140,248,.6); }
  .sq.lose { background: linear-gradient(180deg, #7f1d1d, #450a0a); }
  @keyframes pop { from { transform: scale(.2) rotate(-30deg); opacity: 0; } }
  .mk { font-weight: 800; } .mk.x { color: #f472b6; } .mk.o { color: #38bdf8; }
  .match { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <header class="rx-top">
    <a class="rx-back" href="../index.html">← Deck</a>
    <h1>Tic-Tac-Toe<small>Crossed cutlasses against lifebuoys</small></h1>
    <span id="rx-link" class="rx-pill off">Connecting…</span>
  </header>
  <div class="rx-players">
    <span id="you"><b class="mk x">⚔</b> You <span class="rx-score" id="s-you">0</span></span>
    <span id="them"><span class="rx-score" id="s-them">0</span> <b data-companion>Your companion</b> <b class="mk o">◯</b></span>
  </div>
  <div class="match" id="match"></div>
  <div id="grid" class="grid"></div>
  <div id="status" class="rx-status"></div>
  <div class="rx-bar"><button class="rx-btn primary" id="new">New game</button></div>
</main>
<script src="../lib/neuro.js"></script>
<script src="../lib/juice.js"></script>
<script src="../lib/music.js"></script>
<script src="../lib/scenes.js"></script>
<script src="../lib/crew.js"></script>
<script src="../lib/lines.js"></script>
<script>
"use strict";
const { sfx, fx } = RexGame;
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const SWORD = '<svg viewBox="0 0 100 100"><g stroke="#f472b6" stroke-width="10" stroke-linecap="round"><path d="M20 20 L80 80"/><path d="M80 20 L20 80"/></g><g stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"><path d="M12 30 L30 12"/><path d="M70 12 L88 30"/></g></svg>';
const BUOY = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="32" fill="none" stroke="#38bdf8" stroke-width="16"/><circle cx="50" cy="50" r="32" fill="none" stroke="#fff" stroke-width="16" stroke-dasharray="25 25.3" transform="rotate(22 50 50)"/></svg>';
let cells, turn, over, winLine, starter = "O", match = { you: 0, them: 0 };
const score = { X: 0, O: 0, draw: 0 };
const $ = (id) => document.getElementById(id);
const mutiny = () => game.mode === "mutiny";

const game = RexGame.create({
  name: "Tic-Tac-Toe",
  modes: [
    { id: "classic", label: "Classic", hint: "three in a row wins" },
    { id: "mutiny", label: "Mutiny", hint: "three in a row LOSES" },
    { id: "match", label: "Best of 5", hint: "first to three games" },
  ],
  onMode: (id, byUser) => { match = { you: 0, them: 0 }; newGame(); if (byUser && id === "mutiny") { game.react("mutiny"); RexGame.sfx.roar(); } },
  music: ["cutlass-bossa", "chart-chiptune"],
  scenes: ["sunset", "night", "dawn"],
  rules: "You are playing Tic-Tac-Toe against the user. You are O, the user is X. The squares are numbered 1 to 9: "
    + "1 2 3 on the top row, 4 5 6 in the middle, 7 8 9 at the bottom. Usually three of your marks in a row, column or "
    + "diagonal wins; in Mutiny mode three in a row LOSES. Each turn tells you which mode you're in.",
  actions: [{
    name: "place_mark",
    description: "Put your O on an empty square, numbered 1 (top left) to 9 (bottom right).",
    schema: { type: "object", properties: { square: { type: "integer", enum: [1,2,3,4,5,6,7,8,9] } }, required: ["square"] },
  }],
  onAction(name, { square }) {
    if (over) throw new RexGame.Refuse("The game is over. Wait for the user to start a new one.");
    if (turn !== "O") throw new RexGame.Refuse("It's the user's turn, not yours.");
    const n = RexGame.toInt(square);
    if (!free().includes(n)) throw new RexGame.Refuse(`Square ${square} isn't free. Free squares: ${free().join(", ")}.`);
    return place(n, "O");
  },
  onCompanion: () => render(),
  onConnect: () => { if (!over && turn === "O" && !game.waiting()) askMove(); },
  onAgain: () => { if (game.mode === "match" && (match.you >= 3 || match.them >= 3)) match = { you: 0, them: 0 }; newGame(); },
});

const free = () => cells.map((v, i) => (v ? null : i + 1)).filter(Boolean);
const lineOf = (who) => LINES.find((l) => l.every((i) => cells[i] === who)) || null;
function completes(who) {
  return free().filter((n) => { cells[n - 1] = who; const w = !!lineOf(who); cells[n - 1] = null; return w; });
}

function boardText() {
  const show = (i) => cells[i] || String(i + 1);
  const rows = [0, 3, 6].map((i) => ` ${show(i)} | ${show(i + 1)} | ${show(i + 2)}`).join("\n");
  const facts = [`Free squares: ${free().join(", ")}.`];
  const mine = completes("O"), theirs = completes("X");
  if (mutiny()) {
    facts.unshift("MUTINY MODE: whoever makes three in a row LOSES.");
    const safe = free().filter((n) => !mine.includes(n));
    if (mine.length) facts.push(`DON'T play square ${mine.join(" or ")}: it makes three of yours in a row and you'd lose.`);
    if (safe.length && mine.length) facts.push(`Safe squares: ${safe.join(", ")}.`);
    if (!safe.length) facts.push("Every free square makes three of yours. Sorry!");
  } else {
    if (mine.length) facts.push(`You can WIN right now on square ${mine.join(" or ")}.`);
    else if (theirs.length) facts.push(`The user wins next turn on square ${theirs.join(" and ")} unless you take it.`);
    else if (!cells[4]) facts.push("The centre (5) is free; it is the strongest square.");
  }
  if (game.mode === "match") facts.push(`Match score: you ${match.them}, the user ${match.you} (first to 3).`);
  return "## Board (O = yours, X = the user's, numbers = free squares)\n" + rows + "\n\n" + facts.join("\n");
}

function askMove(lastUser) {
  game.force({
    state: boardText(),
    query: (lastUser ? `The user put an X on square ${lastUser}. ` : "You go first. ") + "Your turn: place_mark on a free square.",
    actions: ["place_mark"],
  });
}

function place(n, who) {
  const blocks = !mutiny() && completes(who === "X" ? "O" : "X").includes(n);
  cells[n - 1] = who;
  if (who === "X") sfx.clang(); else sfx.pop();
  const line = lineOf(who);
  if (line || !free().length) {
    over = true;
    winLine = line;
    // Mutiny: the one who made the line loses.
    const winner = !line ? null : mutiny() ? (who === "X" ? "O" : "X") : who;
    score[winner || "draw"]++;
    render(n);
    return finish(winner, who);
  }
  if (blocks) { if (who === "X") game.award(10, "Blocked!", $("grid").children[n - 1]); else game.react("block"); }
  turn = who === "X" ? "O" : "X";
  render(n);
  if (turn === "O") askMove(n);
  return `Your O is on square ${n}. The user's turn.`;
}

/** The end of one game; in a match, maybe the end of the match. */
function finish(winner, mover) {
  const userWon = winner === "X", draw = !winner;
  const how = draw ? "It's a draw." : mutiny()
    ? (userWon ? "You made three in a row and sank yourself. The user wins!" : "The user made three in a row: mutiny! You win.")
    : (userWon ? "The user got three in a row and won." : "You won with three in a row!");
  if (game.mode === "match" && !draw) match[userWon ? "you" : "them"]++;
  const matchDone = game.mode === "match" && (match.you >= 3 || match.them >= 3);
  const say = `Game over: ${how}` + (game.mode === "match" ? ` Match: you ${match.them}, the user ${match.you}.` : "");
  if (mover === "X") game.tell(say, false);
  if (game.mode === "match" && !matchDone) {
    // Between games of a match: a quick banner, then the next game.
    fx.float(draw ? "Draw" : userWon ? "Point to you!" : `Point to ${game.companion}`, { at: $("grid"), big: true, color: userWon ? "#facc15" : "#f87171" });
    if (draw) sfx.draw(); else if (userWon) sfx.combo(match.you); else sfx.error();
    setTimeout(newGame, 1800);
    return say;
  }
  const outcome = draw ? "draw" : userWon ? "win" : "loss";
  const points = draw ? 10 : !userWon ? 0 : game.mode === "match" ? 150 : mutiny() ? 60 : 50;
  const detail = matchDone ? `${match.you} – ${match.them}` : draw ? "Nobody got three."
    : mutiny() ? (userWon ? `${game.companion} made three in a row and sank.` : "You made three in a row. Mutiny!")
    : (userWon ? "Three cutlasses in a row." : `${game.companion} got three in a row.`);
  setTimeout(() => game.end({ outcome, points, detail,
    title: matchDone ? (userWon ? "MATCH WON!" : "MATCH LOST") : null }), 650);
  return say;
}

function newGame() {
  game.cancelForce();
  cells = Array(9).fill(null); over = false; winLine = null;
  turn = starter; starter = starter === "X" ? "O" : "X";
  render();
  sfx.whoosh();
  game.tell(`New game of Tic-Tac-Toe${mutiny() ? " in MUTINY mode (three in a row loses)" : ""}`
    + `${game.mode === "match" ? `, match score you ${match.them} - the user ${match.you}` : ""}. `
    + `${turn === "X" ? "The user goes" : "You go"} first.`);
  if (turn === "O") askMove();
}

function render(fresh = -1) {
  const grid = $("grid");
  grid.innerHTML = "";
  const loser = winLine && mutiny();
  cells.forEach((v, i) => {
    const sq = document.createElement("div");
    sq.className = `sq${v ? "" : " free"}${winLine && winLine.includes(i) ? (loser ? " lose" : " win") : ""}`;
    sq.innerHTML = v ? (v === "X" ? SWORD : BUOY) : `<span class="n">${i + 1}</span>`;
    if (v && i + 1 !== fresh) sq.firstChild.style.animation = "none";
    sq.onclick = () => { if (!over && turn === "X" && !v) place(i + 1, "X"); };
    grid.appendChild(sq);
  });
  $("s-you").textContent = score.X; $("s-them").textContent = score.O;
  $("you").classList.toggle("turn", !over && turn === "X");
  $("them").classList.toggle("turn", !over && turn === "O");
  $("match").textContent = game.mode === "match" ? `Match: you ${match.you} – ${match.them} ${game.companion} · first to 3` : mutiny() ? "⚠ Mutiny rules: three in a row sinks you" : "";
  const name = RexGame.escape(game.companion);
  $("status").innerHTML = over ? "<b>Game over.</b>" : turn === "X" ? "<b>Your turn.</b>" : `<b>${name}</b> is thinking…`;
}

$("new").onclick = () => { sfx.click(); match = { you: 0, them: 0 }; newGame(); };
cells = Array(9).fill(null); over = false; turn = "X";
render();
</script>
</body>
</html>
